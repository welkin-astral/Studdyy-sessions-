#gate p{color:var(--pink);min-height:1.4em}
:root[data-theme=dark]{--bg:#12142A;--surface:#1B1E3A;--surface-2:#242850;--ink:#ECEEFB;--muted:#A3A8CC;--line:#2E3262;--line-strong:#434A85;--pink-soft:#4A1F38;--pink-softer:#2B1626;--pink-ink:#FFB3D1;--blue-soft:#1D3159;--blue-softer:#18233F;--blue-ink:#BCD4FF;--track:rgba(0,0,0,.35);color-scheme:dark}
.fab{position:fixed;z-index:40;border:0;border-radius:999px;padding:10px 14px;font:600 14px var(--font-body);background:var(--ink);color:var(--bg);cursor:pointer}

#mp{position:fixed;z-index:41;right:14px;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100vw - 28px));height:380px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line-strong);border-radius:18px;display:none;flex-direction:column;overflow:hidden}
#mp.on{display:flex}#mlog{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:14px}

#mlog .u{background:var(--pink-soft);align-self:flex-end}#mlog .a{background:var(--blue-soft)}
#mf{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}#mf input{flex:1;min-width:0;font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink)}
#mf button{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:0 12px}
</style></head><body>
<title>SNAILLLY &amp; BIRDDIIEE studdyyying session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Mono:wght@500&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a big white dashboard for two. Hero, four stat tiles, then a two-column board of cards (timer, targets, chat, video player, sounds, us), with the week and month views below.
   Colour roles: pink = you, blue = your friend. Cards alternate soft pink and soft blue accents on a white page. */
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F6F7FC;
  --ink:#1F2340;--muted:#5C6280;--line:#E8EAF5;--line-strong:#CBCFE6;
  --pink:#C92F6D;--pink-mid:#E8508A;--pink-soft:#FFE4EF;--pink-softer:#FFF4F8;--pink-ink:#9A1B4F;--on-pink:#FFFFFF;
  --blue:#2F6FDB;--blue-mid:#4F8DF0;--blue-soft:#E3EEFF;--blue-softer:#F2F7FF;--blue-ink:#1A4796;--on-blue:#FFFFFF;
  --track:rgba(255,255,255,.85);
  --font-display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;padding-inline:18px;padding-block:24px 56px}
h1,h2,h3,p,ul{margin:0}
.wrap{max-width:1240px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* hero */
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero-l{display:flex;align-items:center;gap:16px;min-width:0}
.pair{font-size:2.6rem;line-height:1;display:flex;gap:4px;flex:none}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.55rem,4.6vw,2.9rem);line-height:1.08;letter-spacing:-.015em;overflow-wrap:anywhere}
h1 .n1{color:var(--pink)}
h1 .n2{color:var(--blue)}
h1 .amp{color:var(--muted);font-weight:600}
h1 .sess{display:block;font-size:.55em;font-weight:600;color:var(--ink);letter-spacing:0;margin-top:4px}
.dateline{color:var(--muted);font-size:14px;margin-top:2px}
.hero-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.here{display:flex;gap:6px;flex-wrap:wrap}
.hchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:5px 12px}
.hchip.me{background:var(--pink-soft);color:var(--pink-ink)}
.hchip.them{background:var(--blue-soft);color:var(--blue-ink)}
.live{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:13px}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.live.on .dot{background:var(--blue)
              .banner{border:1px solid var(--blue);background:var(--blue-softer);color:var(--blue-ink);border-radius:14px;padding:12px 16px;font-size:15px}

/* stats */
.stats{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{display:flex;align-items:center;gap:14px;border-radius:20px;padding:18px 20px;min-width:0}
.tile.p{background:var(--pink-soft)}
.tile.b{background:var(--blue-soft)}
.te{font-size:2rem;line-height:1;flex:none}
.tl{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tile.p .tl{color:var(--pink-ink)}.tile.b .tl{color:var(--blue-ink)}
.tv{font-family:var(--font-display);font-weight:700;font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tbody{min-width:0;flex:1}
.gbar{height:8px;border-radius:99px;background:rgba(255,255,255,.75);overflow:hidden;margin-top:6px}
.gfill{height:100%;width:0;border-radius:99px;background:var(--blue);transition:width .3s}
.goalrow{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:6px;color:var(--blue-ink)}
.goalrow input{width:70px;min-height:32px;padding:4px 8px;border-radius:8px}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.tile{flex-direction:column;align-items:flex-start;gap:6px;padding:14px}.tv{font-size:1.6rem}}

/* board */
.board{display:grid;gap:20px;align-items:stretch;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  grid-template-areas:"timer targets" "us invite" "week week" "month notes" "sounds sounds" "player player" "chat chat"}
.timer{grid-area:timer}.targets{grid-area:targets}.chat{grid-area:chat}.player{grid-area:player}
.sounds{grid-area:sounds}.us{grid-area:us}.invite{grid-area:invite}.week{grid-area:week}.month{grid-area:month}.notes{grid-area:notes}
@media (max-width:900px){.board{grid-template-columns:minmax(0,1fr);
  grid-template-areas:"timer" "targets" "us" "invite" "week" "month" "notes" "sounds" "player" "chat"}}

.card{background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0;position:relative}
.card.tp{border-color:var(--pink-soft)}
.card.tb{border-color:var(--blue-soft)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card h2{font-family:var(--font-display);font-weight:600;font-size:1.3rem;letter-spacing:-.005em;display:flex;align-items:center;gap:10px}
.hb{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;font-size:1.2rem;line-height:1}
.hb.p{background:var(--pink-soft)}.hb.b{background:var(--blue-soft)}
.count{color:var(--muted);font-size:14px}

.btn{font:inherit;font-weight:600;border-radius:14px;padding:10px 20px;border:1px solid transparent;cursor:pointer;min-height:46px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;transition:filter .12s}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--pink);color:var(--on-pink)}
.btn.blue{background:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--ink)}
.btn.small{min-height:36px;padding:6px 14px;font-size:14px}
input[type=text],input[type=search],input[type=number],select{font:inherit;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;min-width:0;width:100%;min-height:46px}
input[type=range]{width:100%;accent-color:var(--pink)}
input::placeholder{color:var(--muted);opacity:1}
input:disabled,select:disabled{opacity:.6}
.row{display:flex;gap:8px;align-items:center}
.addhost{position:relative}
.emobtn{flex:none;width:46px;min-height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);font-size:1.4rem;cursor:pointer;line-height:1}
.emobtn:hover:not(:disabled){background:var(--pink-soft)}
.emobtn:disabled{opacity:.6;cursor:not-allowed}

/* picker */
.picker{position:absolute;z-index:20;left:0;width:min(350px,100%);background:var(--surface);border:1.5px solid var(--line-strong);border-radius:18px;padding:10px;box-shadow:0 14px 36px rgba(31,35,64,.18)}
.picker.up{bottom:calc(100% + 8px)}
.picker.down{top:calc(100% + 8px)}
.ptabs{display:flex;gap:4px;margin-bottom:8px}
.ptab{flex:1;border:0;background:var(--surface-2);border-radius:10px;font-size:1.2rem;padding:4px;cursor:pointer}
.ptab.on{background:var(--pink-soft)}
.pgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
.pe{font-size:1.5rem;background:none;border:0;border-radius:10px;cursor:pointer;padding:4px;line-height:1.25}
.pe:hover{background:var(--blue-soft)}

/* timer */
.timer{background:linear-gradient(145deg,var(--pink-softer),var(--blue-softer));border-color:var(--pink-soft)}
.status{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--muted)}
.status.running{border-color:var(--pink);color:var(--pink-ink);background:var(--pink-soft)}
.status.running::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pink);margin-right:7px;animation:pulse 1.4s ease-in-out infinite}
.status.paused{border-color:var(--blue);color:var(--blue-ink);background:var(--blue-soft)}
.status.done{border-color:var(--pink);color:var(--pink-ink);background:var(--surface)}
@keyframes pulse{50%{opacity:.35}}
.seg{display:inline-flex;align-self:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.segb{font:inherit;font-weight:600;font-size:14px;border:0;background:none;color:var(--muted);border-radius:10px;padding:8px 16px;cursor:pointer;min-height:38px}
.segb.on{background:var(--blue);color:var(--on-blue)}
.segb:disabled{opacity:.5;cursor:not-allowed}
              .cdset{display:flex;flex-direction:column;gap:12px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.center{justify-content:center}
.pchip{font:inherit;font-weight:600;font-size:14px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:36px}
.pchip.brk{border-color:var(--blue);color:var(--blue-ink)}
.pchip.foc{border-color:var(--pink);color:var(--pink-ink)}
.pchip:disabled{opacity:.5;cursor:not-allowed}
.cdform{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.cdform label{display:flex;flex-direction:column;gap:2px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cdform input{width:78px;text-align:center}
.ringbox{position:relative;width:min(300px,76vw);aspect-ratio:1;margin-inline:auto;max-width:100%}
.ring{width:100%;height:100%;display:block}
.ring .track{fill:none;stroke:var(--track);stroke-width:10}
.ring .arc{fill:none;stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:100px 100px}
.digits{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-mono);font-weight:500;font-size:clamp(2.4rem,10vw,3.3rem);line-height:1;font-variant-numeric:tabular-nums;padding-bottom:22px}
.digits.long{font-size:clamp(1.8rem,7.5vw,2.4rem)}
.kind{position:absolute;left:0;right:0;bottom:24%;text-align:center;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.who,.today,.note{text-align:center;font-size:14px;color:var(--muted)}
.today{color:var(--ink)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btns .btn{min-width:140px}

/* targets */
.pbar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pfill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--pink-mid),var(--blue-mid));transition:width .3s ease}
.list{list-style:none;padding:0}
.scroll{max-height:330px;overflow-y:auto}
.t{display:flex;align-items:center;gap:10px;padding:9px 0}
.t+.t{border-top:1px solid var(--line)}
.tmain{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer;padding-block:4px}
.temo{font-size:1.3rem;line-height:1;flex:none}
.ttext{overflow-wrap:anywhere}
.t.done .ttext{color:var(--muted);text-decoration:line-through}
.cb{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin:0;border:2px solid var(--line-strong);border-radius:8px;background:var(--surface);display:grid;place-content:center;cursor:pointer}
.cb::after{content:"";width:6px;height:12px;border:solid var(--on-pink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);margin-top:-2px;transition:transform .15s}
.cb:checked{background:var(--pink);border-color:var(--pink)}
.cb:checked::after{transform:rotate(45deg) scale(1)}
.cb:disabled{cursor:not-allowed;opacity:.6}
.chip{flex:none;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.me{background:var(--pink-soft);color:var(--pink-ink)}
.chip.them{background:var(--blue-soft);color:var(--blue-ink)}
.x{flex:none;background:none;border:0;color:var(--muted);font-size:22px;line-height:1;width:36px;height:36px;border-radius:10px;cursor:pointer}
.x:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.x:disabled{opacity:.4;cursor:not-allowed}
.empty{color:var(--muted);max-width:48ch}

/* chat */
.chatlist{height:330px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--surface-2);border-radius:18px}
.msg{display:flex;flex-direction:column;max-width:84%;gap:2px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.them{align-self:flex-start;align-items:flex-start}
.mhead{font-size:12px;color:var(--muted)}
.bubble{padding:8px 14px;border-radius:18px;overflow-wrap:anywhere;white-space:pre-wrap}
.me .bubble{background:var(--pink);color:var(--on-pink);border-bottom-right-radius:6px}
.them .bubble{background:var(--blue);color:var(--on-blue);border-bottom-left-radius:6px}
.bubble.big{font-size:2.6rem;line-height:1.1;background:none;color:inherit;padding:0 4px}
.stickers{display:flex;gap:6px;flex-wrap:wrap}
.stk{font-size:1.5rem;line-height:1;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 10px;cursor:pointer}
.stk:hover:not(:disabled){background:var(--blue-soft)}
.stk:disabled{opacity:.5;cursor:not-allowed}

/* video player + sounds */
.drop{border:2px dashed var(--blue-mid);background:var(--blue-softer);border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--blue-ink)}
.drop.over{background:var(--blue-soft);border-style:solid}
.drop input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.stage{background:#10132b;border-radius:18px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#C9CDE8;text-align:center}
.stage video{width:100%;height:100%;background:#000;display:block}
.stage .ph{padding:20px;font-size:15px;max-width:34ch}
.nowp{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.vrow+.vrow{border-top:1px solid var(--line)}
.vplay{flex:1;min-width:0;font:inherit;text-align:left;background:none;border:0;padding:6px 8px;border-radius:12px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column}
.vplay:hover{background:var(--blue-softer)}
.vrow.on .vplay{background:var(--blue-soft)}
.mstat{font-size:11px;color:var(--muted);line-height:1.3}
.mstat.seen{color:var(--blue-ink);font-weight:600}
.vt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
              @media (min-width:901px){.sounds .sgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.snd{font:inherit;font-weight:600;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:12px 14px;cursor:pointer;min-height:56px;text-align:left}
.snd .se{font-size:1.6rem;line-height:1}
.snd:hover{background:var(--blue-softer)}
.snd.on{background:var(--pink-soft);border-color:var(--pink);color:var(--pink-ink)}
.vol{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}

/* us */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pt{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pt.me{background:var(--pink-softer);border:1.5px solid var(--pink-soft)}
.pt.them{background:var(--blue-softer);border:1.5px solid var(--blue-soft)}
.pt.ghost{border:1.5px dashed var(--line-strong);background:var(--surface);color:var(--muted)}
.pav{font-size:2.6rem;line-height:1}
.pname{font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.pname span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.odot{width:9px;height:9px;border-radius:50%;background:var(--line-strong);flex:none}
.odot.on{background:var(--blue)}
.pstat{font-size:14px;color:var(--ink);overflow-wrap:anywhere}
.pmeta{font-size:13px;color:var(--muted)}
.medit{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.medit h3{font-size:14px;font-weight:600;color:var(--muted)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{font-size:1.5rem;line-height:1;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 10px;cursor:pointer}
.opt.on{border-color:var(--pink);background:var(--pink-soft)}
.opt:disabled{opacity:.5;cursor:not-allowed}

/* week + month */
.plot{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:8px}
.axis{position:relative;height:170px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.axis span{position:absolute;right:0;transform:translateY(-50%);line-height:1}
.axis .a1{top:20px}.axis .a2{top:95px}.axis .a3{top:170px}
.cols{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));column-gap:8px}
.grid{position:absolute;left:0;right:0;top:20px;height:150px;pointer-events:none;

.col{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bararea{position:relative;height:170px;width:100%;display:flex;justify-content:center}
.fill{position:absolute;bottom:0;width:min(34px,72%);height:calc(var(--h) * 150px);background:var(--blue-mid);border-radius:4px 4px 0 0}
.fill.has{min-height:4px}
.col.today .fill{background:var(--pink-mid)}
.val{position:absolute;bottom:calc(var(--h) * 150px + 4px);font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.dl{font-size:12px;color:var(--muted);text-align:center;line-height:1.25}
.dl b{display:block;color:var(--ink);font-weight:600}
.col.today .dl b{color:var(--pink-ink)}
.td{font-size:11.5px;font-weight:600;min-width:22px;text-align:center;border-radius:999px;padding:2px 7px;color:var(--blue-ink);background:var(--blue-soft);font-variant-numeric:tabular-nums}
.td.none{background:none;color:var(--muted);font-weight:400}
.legend{font-size:13px;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.mi{border-radius:16px;padding:12px 14px}
.mi:nth-child(odd){background:var(--pink-softer)}
.mi:nth-child(even){background:var(--blue-softer)}
.mi small{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.mi b{font-family:var(--font-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12.5px}
.mm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;max-width:520px}
.mh{font-size:12px;color:var(--muted);text-align:center}
.cell{aspect-ratio:1.2;border-radius:10px;background:var(--surface-2);padding:4px 6px;font-size:11px;color:var(--muted);min-width:0}
.cell.l1{background:#FFE3EE;color:#7A1440}
.cell.l2{background:#FBB5D0;color:#55102B}
.cell.l3{background:#E8508A;color:#3D0A1F}
.cell.l4{background:#C92F6D;color:#FFFFFF}
.cell.out{background:none}
.cell.now{outline:2.5px solid var(--blue);outline-offset:1px}
.swatches{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.sw{width:16px;height:16px;border-radius:5px;display:inline-block}

    for (var i = 0; i < days[0].dow; i++) cells.push(h("div", { class: "cell out" }));
    var total = 0, active = 0;
    days.forEach(function (d) {
      var ms = map[d.key].ms;
      total += ms;
      if (ms > 0) active++;
      var lvl = ms <= 0 ? "" : (ms >= g ? " l4" : (ms >= g * 0.5 ? " l3" : (ms >= g * 0.25 ? " l2" : " l1")));
      cells.push(h("div", { class: "cell" + lvl + (d.isToday ? " now" : ""), title: d.full + ": " + (ms ? fmtDur(ms) : "no study time"), text: String(d.date) }));
    });
    var tail = (7 - ((days[0].dow + days.length) % 7)) % 7;
    for (var j = 0; j < tail; j++) cells.push(h("div", { class: "cell out" }));
    fill($("mm"), cells);
    $("monSum").textContent = active + " of 30 days, " + fmtDur(total);
  }

  function renderNotes() {
    var notes = state.notes.slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    fill($("wall"), notes.map(function (n) {
      return h("div", { class: "sticky " + (n.color === "blue" ? "blue" : "pink") },
        h("p", { text: n.text }),
        h("div", { class: "sfoot" }, h("span", { text: avatarOf(n.by) + " " + whoName(n.by) }),
          h("button", { class: "x", type: "button", disabled: locked(), "aria-label": "Remove note", onclick: function () { deleteNote(n); } }, "×")));
    }));
    $("noteCount").textContent = notes.length ? notes.length + " note" + (notes.length === 1 ? "" : "s") : "";
    var em = $("nEmpty");
    if (!loaded.notes) { em.hidden = false; em.textContent = "Connecting to your room..."; }
    else if (!notes.length) { em.hidden = false; em.textContent = "The wall is empty. Stick up formulas, questions or plans so you both see them."; }
    else em.hidden = true;
  }

  function renderAll() {
    renderChrome(); renderStats(); renderTimer(); renderTargets(); renderChat(); renderVideos();
    renderSounds(); renderUs(); renderWeek(); renderMonth(); renderNotes();
  }

  /* ---------- people names ---------- */
  async function refreshNames() {
    if (!ctx.user || ctx.mode !== "shared") return;
    var ids = {};
    function add(id) { if (id) ids[id] = 1; }
    state.targets.forEach(function (t) { add(t.by); add(t.doneBy); });
    state.chat.forEach(function (m) { add(m.by); });
    state.notes.forEach(function (n) { add(n.by); });
    state.people.forEach(function (p) { add(p.id); });
    Object.keys(onlineIds).forEach(add);
    add(state.timer.by);
    delete ids[ctx.uid];
    var arr = Object.keys(ids).sort(), key = arr.join("|");
    if (key === namesKey || !arr.length) return;
    namesKey = key;
    try {
      var ps = await ctx.user.profiles(arr);
      arr.forEach(function (id) { names[id] = (ps[id] && ps[id].name) || ""; });
      renderAll();
    } catch (e) {}
  }

  /* ---------- shared room connection ---------- */
  function onErr() { ctx.lost = true; renderAll(); }
  function docs(s, withId) { return s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); }
  function subscribe() {
    var from = lastDays(35)[0].key;
    ctx.db.doc("room/timer").onSnapshot(function (s) {
      state.timer = Object.assign({}, DEF_TIMER, s.exists ? s.data() : {});
      loaded.timer = true;
      renderTimer(); renderStats(); renderWeek(); renderMonth(); refreshNames();
    }, onErr);
    ctx.db.doc("room/settings").onSnapshot(function (s) {
      state.settings = Object.assign({}, DEF_SETTINGS, s.exists ? s.data() : {});
      loaded.settings = true;
      renderStats(); renderWeek(); renderMonth();
    }, onErr);
    ctx.db.collection("targets").orderBy("createdAt", "desc").limit(300).onSnapshot(function (s) {
      state.targets = docs(s); loaded.targets = true;
      renderTargets(); renderStats(); renderWeek(); renderMonth(); renderUs(); refreshNames();
    }, onErr);
    ctx.db.collection("sessions").where("day", ">=", from).onSnapshot(function (s) {
      state.sessions = docs(s); loaded.sessions = true;
      renderTimer(); renderStats(); renderWeek(); renderMonth();
    }, onErr);
    ctx.db.collection("chat").orderBy("createdAt", "desc").limit(100).onSnapshot(function (s) {
      state.chat = docs(s); loaded.chat = true;
      renderChat(); refreshNames();
    }, onErr);
    ctx.db.collection("notes").orderBy("createdAt", "desc").limit(60).onSnapshot(function (s) {
      state.notes = docs(s); loaded.notes = true;
      renderNotes(); refreshNames();
    }, onErr);
    ctx.db.collection("people").onSnapshot(function (s) {
         state.people = docs(s); loaded.people = true;
      renderAll(); refreshNames();
      if (!seenSent) { seenSent = true; touchSeen(); }
    }, onErr);
  }
  function touchSeen() {
    if (ctx.mode !== "shared" || !loaded.people || ctx.readOnly || !ctx.uid) return;
    var now = Date.now(), ref = ctx.db.doc("people/" + ctx.uid);
    try {
      var p = personOf(ctx.uid) ? ref.update({ lastSeen: now }) : ref.set({ avatar: "", mood: "", status: "", lastSeen: now, updatedAt: now });
      p.catch(function () {});
    } catch (e) {}
  }
  async function connect() {
    var c = window.claude;
    if (!c || typeof c.use !== "function") { goLocal(); return; }
    var db = null, user = null, room = null;
    try { db = await c.use("db"); } catch (e) { db = null; }
    try { user = await c.use("user"); } catch (e) { user = null; }
    if (!db) { goLocal(); return; }
    ctx.db = db;
    ctx.user = user;
    var uid = null;
    try { uid = user ? await user.id() : null; } catch (e) {}
    ctx.uid = uid || "anon";
    try {
      var cw = user ? await user.can("data.write") : null;
      if (cw === false) ctx.readOnly = true;
    } catch (e) {}
    ctx.mode = "shared";
    renderAll();
    subscribe();
    try { room = await c.use("room"); } catch (e) { room = null; }
    if (room) {
      roomApi = room;
      roomState = "on";
      try { room.presence({ away: document.hidden, typing: false }).catch(function () {}); } catch (e) {}
      try {
        room.onPeers(function (ch) {
          var o = {}, ty = {};
          ch.peers.forEach(function (p) {
            if (p.kind !== "viewer" || !p.by) return;
            var pr = p.presence || {};
            o[p.by] = pr.away ? "away" : "online";
            ty[p.by] = !!pr.typing;
          });
          onlineIds = o;
          typingIds = ty;
          renderHere(); renderUs(); renderTyping(); refreshNames();
        }, function () { roomState = "off"; renderHere(); renderUs(); });
      } catch (e) { roomState = "off"; }
    } else roomState = "off";
    renderHere(); renderUs();
  }

  /* ---------- wiring ---------- */
  $("dateLine").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });

  // timer controls
  $("modeSw").addEventListener("click", function () { setMode("stopwatch"); });
  $("modeCd").addEventListener("click", function () { setMode("countdown"); });
  fill($("presetChips"), PRESETS.map(function (p) {
    return h("button", { type: "button", class: "pchip " + (p.kind === "break" ? "brk" : "foc"), onclick: function () { applyCountdown(p.min * 60000, p.kind); } }, p.label);
  }));
  $("cdForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var hh = parseInt($("cdH").value, 10) || 0, mm = parseInt($("cdM").value, 10) || 0, ss = parseInt($("cdS").value, 10) || 0;
    var total = Math.min(86400, Math.max(0, hh) * 3600 + Math.max(0, mm) * 60 + Math.max(0, ss));
    if (total < 1) { toast("Pick a time above zero."); return; }
    applyCountdown(total * 1000, "focus");
  });
  $("startBtn").addEventListener("click", startPause);
  $("resetBtn").addEventListener("click", function () {
    if (!resetArmed) {
      resetArmed = true;
      renderTimer();
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function () { resetArmed = false; renderTimer(); }, 3000);
      return;
    }
    resetArmed = false;
    clearTimeout(resetTimer);
    resetNow();
  });

  // goal
  $("goalIn").addEventListener("change", function () { if (!locked()) saveGoal(parseFloat($("goalIn").value)); });

  // targets
  $("tEmo").addEventListener("click", function () {
    openPicker($("tEmo"), $("tForm"), function (e) { newTargetEmoji = e; $("tEmo").textContent = e; }, false, false);
  });
  $("tForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var inp = $("tInput"), text = inp.value.trim();
    if (!text || locked()) return;
    inp.value = "";
    closePicker();
    addTarget(text);
    inp.focus();
  });

  // chat
  fill($("stickers"), STICKERS.map(function (s) {
    return h("button", { type: "button", class: "stk", "aria-label": "Send " + s, onclick: function () { sendChat(s, true); } }, s);
  }));
  $("chatEmo").addEventListener("click", function () {
    openPicker($("chatEmo"), $("chatForm"), function (e) {
      var inp = $("chatInput");
      inp.value = (inp.value + e).slice(0, 500);
      inp.focus();
    }, true, true);
  });
  $("chatForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var inp = $("chatInput"), text = inp.value;
    if (!text.trim() || locked()) return;
    inp.value = "";
    closePicker();
    if (roomApi) roomApi.presence({ typing: false }).catch(function () {});
    var ok = await sendChat(text, false);
    if (!ok) inp.value = text;
    inp.focus();
  });

  // video player
  ["vFile", "vFile2"].forEach(function (id) {
    $(id).addEventListener("change", function () { addVideoFiles($(id).files); $(id).value = ""; });
  });
  $("vPickFiles").addEventListener("click", function () { $("vFile").click(); });
  $("vPickGallery").addEventListener("click", function () { $("vFile2").click(); });
  var drop = $("vDrop");
  ["dragenter", "dragover"].forEach(function (n) { drop.addEventListener(n, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
  ["dragleave", "drop"].forEach(function (n) { drop.addEventListener(n, function (e) { e.preventDefault(); drop.classList.remove("over"); }); });
  drop.addEventListener("drop", function (e) { if (e.dataTransfer) addVideoFiles(e.dataTransfer.files); });
  loadVideos();

  // sounds
  $("vol").addEventListener("input", function () { volume = parseInt($("vol").value, 10) / 100; applyVolume(); });

  // us
  fill($("avOpts"), AVATARS.map(function (a) {
    return h("button", { type: "button", class: "opt", "data-v": a, "aria-label": "Buddy " + a, onclick: function () { saveMe({ avatar: a }); } }, a);
  }));
       fill($("moodOpts"), MOODS.map(function (m) {
    return h("button", { type: "button", class: "opt", "data-v": m, "aria-label": "Mood " + m, onclick: function () { saveMe({ mood: m }); } }, m);
  }));
  $("statusForm").addEventListener("submit", function (e) {
    e.preventDefault();
    if (locked()) return;
    saveMe({ status: $("statusIn").value.trim() });
    toast("Status saved.");
  });

  // notes
  Array.prototype.forEach.call($("nColors").children, function (b) {
    b.addEventListener("click", function () {
      noteColor = b.getAttribute("data-c");
      Array.prototype.forEach.call($("nColors").children, function (x) { x.className = "cdot " + (x.getAttribute("data-c") === "blue" ? "bl" : "pk") + (x === b ? " on" : ""); });
    });
  });
  $("nForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var inp = $("nInput"), text = inp.value.trim();
    if (!text || locked()) return;
    inp.value = "";
    var ok = await addNote(text);
    if (!ok) inp.value = text;
  });

  // week toggle
  $("wToggle").addEventListener("click", function () {
    chartMode = !chartMode;
    $("plot").hidden = !chartMode;
    $("tableWrap").hidden = chartMode;
    $("wToggle").textContent = chartMode ? "Table" : "Chart";
  });

  // typing indicator and away status
  $("chatInput").addEventListener("input", function () {
    if (!roomApi) return;
    roomApi.presence({ typing: true }).catch(function () {});
    clearTimeout(typingTimer);
    typingTimer = setTimeout(function () { roomApi.presence({ typing: false }).catch(function () {}); }, 3000);
  });
  document.addEventListener("visibilitychange", function () {
    if (roomApi) roomApi.presence({ away: document.hidden }).catch(function () {});
    if (document.hidden) touchSeen(); else markSeen();
  });
  window.addEventListener("scroll", function () { markSeen(); }, { passive: true });
  window.addEventListener("focus", markSeen);
  window.addEventListener("pagehide", touchSeen);

  // invite link
  $("copyInvite").addEventListener("click", function () {
    var inp = $("inviteLink"), msg = $("copyMsg");
    function manual() { inp.focus(); inp.select(); msg.textContent = "Link selected. Press Ctrl+C, or tap and hold, to copy it."; }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(inp.value).then(function () { msg.textContent = "Link copied. Send it to your friend."; toast("Invite link copied."); }, manual);
      } else manual();
    } catch (e) { manual(); }
  });

  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closePicker(); });
  document.addEventListener("pointerdown", unlockAudio, { once: true });

  renderAll();
  connect();

  var ticks = 0;
  setInterval(function () {
    updateClock();
    var t = state.timer;
    if (t.running && t.mode === "countdown" && t.startedAt && elapsed() >= (t.durationMs || 0) && finishGuard !== t.startedAt) {
      finishGuard = t.startedAt;
      if (!locked()) finishCountdown(Object.assign({}, t));
    }
    ticks++;
    if (ticks % 20 === 0) { refreshStatus(); markSeen(); }
    if (ticks % 20 === 0) { renderStats(); renderWeek(); renderMonth(); }
  }, 250);
};
</script>

 var days=Math.ceil((new Date(d+"T00:00:00")-new Date())/864e5);
 ex.textContent="\uD83D\uDCC5 "+n+": "+(days>0?days+" days left":days===0?"today! Best of luck":"done")}

 var d=prompt("Exam date (YYYY-MM-DD):",g("sb-exam")||"");if(!d||isNaN(new Date(d)))return;s("sb-examn",n.slice(0,30));s("sb-exam",d);exr()};

 var w=add("a","Thinking...");

 try{var r=await fetch(window.SB_MIVI_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:q,history:hist})});
  var j=await r.json();w.textContent=j.reply;hist.push({role:"user",parts:[{text:q}]},{role:"model",parts:[{text:j.reply}]});hist=hist.slice(-8)}
 catch(x){w.textContent="Mivi could not connect. Try again."}};
